name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cafe-kit .
      - name: Container serves the demo
        run: |
          docker run -d -p 3000:3000 --name app cafe-kit
          for i in $(seq 1 30); do curl -fs http://localhost:3000/c/cafeteria-de-barrio > /dev/null && break; sleep 2; done
          curl -fs http://localhost:3000/c/cafeteria-de-barrio | grep -q "Cafetería de Barrio"
